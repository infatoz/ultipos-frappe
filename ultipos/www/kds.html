<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - UltiPOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
        
        .ticket-enter { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .flash-bg { animation: flashLight 1.5s 2; }
        @keyframes flashLight {
            0%, 100% { background-color: #ffffff; }
            50% { background-color: #fef08a; } 
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-orange-100 selection:text-orange-900">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm z-10 shrink-0">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">Ulti<span class="text-orange-600">KDS</span></h1>
            
            <select id="station-selector" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none block py-2 px-4 font-semibold cursor-pointer transition-all hover:bg-gray-100" onchange="changeStation()">
                <option value="Main Station">Main Station (Fallback)</option>
                <option value="Kitchen Station">Kitchen Station</option>
                <option value="Juice Bar Station">Juice Bar Station</option>
            </select>
        </div>

        <div class="flex items-center gap-6">
            <div id="connection-status" class="flex items-center gap-2 text-sm font-bold text-gray-500 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                </span>
                Connecting...
            </div>
            <div id="clock" class="text-xl font-bold font-mono text-gray-700 tracking-tight">--:--</div>
        </div>
    </header>

    <main class="flex-1 p-8 overflow-x-auto overflow-y-hidden">
        <div id="ticket-board" class="flex flex-col flex-wrap gap-6 h-full content-start items-start">
            
            <div id="empty-state" class="w-full flex flex-col items-center justify-center text-gray-400 mt-32 absolute left-0">
                <div class="bg-white p-6 rounded-full shadow-sm mb-4 border border-gray-100">
                    <svg class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-gray-600">No Active Tickets</h2>
                <p class="mt-1 text-sm">Waiting for orders on <span id="current-station-text" class="text-orange-600 font-semibold">Main Station</span>...</p>
            </div>

        </div>
    </main>

    <audio id="kds-alarm">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const currentUser = "{{ frappe.session.user }}";
        if (currentUser === "Guest") window.location.href = "/login?redirect-to=/kds";

        let currentStation = "Main Station";
        let activeTickets = [];

        // Aussie Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-AU', {
                timeZone: 'Australia/Sydney', hour: '2-digit', minute:'2-digit', second:'2-digit'
            });
        }, 1000);

        function changeStation() {
            currentStation = document.getElementById('station-selector').value;
            document.getElementById('current-station-text').innerText = currentStation;
            renderTickets(); 
            
            document.getElementById('kds-alarm').play().catch(()=>{});
            document.getElementById('kds-alarm').pause();
        }

        // ==========================================
        // WEBSOCKET CONNECTION
        // ==========================================
        
        // 🎯 THE FIX: Force the connection to the correct Frappe Socket port
        const socketPort = window.location.port ? ':9000' : '';
        const socketUrl = window.location.protocol + '//' + window.location.hostname + socketPort;
        
        const socket = io(socketUrl, {
            withCredentials: true,
            reconnectionAttempts: 5
        }); 

        socket.on('connect', () => {
            console.log("✅ Socket connected!");
            const status = document.getElementById('connection-status');
            status.innerHTML = `<span class="relative flex h-2.5 w-2.5"><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span></span> <span class="text-gray-700">Online</span>`;
        });

        socket.on('disconnect', () => {
            console.log("❌ Socket disconnected!");
            const status = document.getElementById('connection-status');
            status.innerHTML = `<span class="relative flex h-2.5 w-2.5"><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500 animate-pulse"></span></span> <span class="text-red-600">Offline</span>`;
        });

        // Catching the broadcast from kot.py
        socket.on('kot_print', function(data) {
            console.log("🔥 NEW KOT RECEIVED:", data);
            
            // Look for our specific station's ticket
            const myTicketData = data.printers.find(p => p.printer_name === currentStation);
            
            if (myTicketData) {
                const alarm = document.getElementById('kds-alarm');
                alarm.currentTime = 0;
                alarm.play().catch(e=>console.log("Audio blocked", e));

                activeTickets.push({
                    id: data.order_number,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    type: data.order_type,
                    items: myTicketData.items
                });
                renderTickets();
            }
        });

        // ==========================================
        // RENDER UI
        // ==========================================
        function bumpTicket(index) {
            // When the chef clicks Done, it removes the ticket from the screen!
            activeTickets.splice(index, 1);
            renderTickets();
        }

        function renderTickets() {
            const board = document.getElementById('ticket-board');
            const emptyState = document.getElementById('empty-state');
            
            if (activeTickets.length === 0) {
                board.innerHTML = '';
                board.appendChild(emptyState);
                emptyState.style.display = 'flex';
                return;
            }

            emptyState.style.display = 'none';
            let html = '';

            activeTickets.forEach((ticket, index) => {
                let itemsHtml = '';
                ticket.items.forEach(it => {
                    let modsStr = '';
                    if (it.modifiers && it.modifiers.length > 0) {
                        modsStr = `<div class="mt-1.5 ml-9 flex flex-wrap gap-1">
                                      ${it.modifiers.map(m => `<span class="text-xs font-semibold bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md border border-gray-200">+ ${m.name}</span>`).join('')}
                                   </div>`;
                    }
                    
                    let noteStr = it.note ? `<div class="text-orange-700 text-xs font-bold bg-orange-50 px-2 py-1 rounded-md mt-2 ml-9 border border-orange-100">📝 ${it.note}</div>` : '';

                    itemsHtml += `
                        <div class="py-4 border-b border-gray-100 last:border-0 group">
                            <div class="flex items-start gap-3">
                                <span class="bg-gray-900 text-white font-bold px-2.5 py-1 rounded-lg text-sm min-w-[36px] text-center shadow-sm">${it.qty}</span>
                                <span class="font-bold text-lg text-gray-800 leading-tight pt-0.5 group-hover:text-orange-600 transition-colors">${it.name}</span>
                            </div>
                            ${modsStr}
                            ${noteStr}
                        </div>`;
                });

                const isDelivery = ticket.type === "Delivery";
                const headerBg = isDelivery ? 'bg-orange-50 border-orange-100 text-orange-800' : 'bg-blue-50 border-blue-100 text-blue-800';
                const badgeBg = isDelivery ? 'bg-orange-200 text-orange-900' : 'bg-blue-200 text-blue-900';

                html += `
                    <div class="bg-white border border-gray-200 rounded-2xl w-[340px] max-h-full flex flex-col shadow-sm hover:shadow-xl transition-all duration-300 ticket-enter flash-bg shrink-0 overflow-hidden">
                        
                        <div class="${headerBg} border-b p-4 flex justify-between items-center shrink-0">
                            <div>
                                <div class="font-black text-2xl tracking-tight">${ticket.id.split('-').pop()}</div>
                                <div class="mt-1 inline-block ${badgeBg} text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded-full">${ticket.type}</div>
                            </div>
                            <div class="text-right">
                                <div class="font-mono text-xl font-bold">${ticket.time}</div>
                                <div class="text-[10px] font-bold text-gray-400 tracking-widest uppercase mt-1">Ordered</div>
                            </div>
                        </div>
                        
                        <div class="px-5 py-2 flex-1 overflow-y-auto min-h-[180px]">
                            ${itemsHtml}
                        </div>
                        
                        <div class="p-4 bg-gray-50 border-t border-gray-100 shrink-0">
                            <button onclick="bumpTicket(${index})" class="w-full bg-white hover:bg-green-50 border border-gray-200 hover:border-green-200 text-gray-700 hover:text-green-700 font-bold text-sm py-3 rounded-xl shadow-sm active:scale-95 transition-all flex justify-center items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                BUMP TICKET
                            </button>
                        </div>
                    </div>`;
            });

            board.innerHTML = html;
        }
    </script>
</body>
</html>
