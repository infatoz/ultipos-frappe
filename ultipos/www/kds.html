<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - UltiPOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
        .ticket-enter { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-orange-100 selection:text-orange-900">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm z-10 shrink-0">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">Ulti<span class="text-orange-600">KDS</span></h1>
            
            <select id="station-selector" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none block py-2 px-4 font-semibold cursor-pointer" onchange="changeStation()">
                <option value="Main Station">Main Station (Fallback)</option>
            </select>
        </div>

        <div class="flex items-center gap-6">
            <div id="connection-status" class="flex items-center gap-2 text-sm font-bold text-gray-500 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span>
                <span class="text-gray-700">Live Sync</span>
            </div>
            <div id="clock" class="text-xl font-bold font-mono text-gray-700 tracking-tight">--:--</div>
        </div>
    </header>

    <main class="flex-1 p-8 overflow-x-auto overflow-y-hidden">
        <div id="ticket-board" class="flex flex-col flex-wrap gap-6 h-full content-start items-start">
            </div>
    </main>

    <audio id="kds-alarm">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const currentUser = "{{ frappe.session.user }}";
        if (currentUser === "Guest") window.location.href = "/login?redirect-to=/kds";
        window.csrf_token = "{{ frappe.session.csrf_token }}";

        let currentStation = "Main Station";
        let knownOrders = new Set();
        let isFirstLoad = true;

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-AU', {
                timeZone: 'Australia/Sydney', hour: '2-digit', minute:'2-digit', second:'2-digit'
            });
        }, 1000);

        function changeStation() {
            currentStation = document.getElementById('station-selector').value;
            knownOrders.clear(); // Reset so alarm rings for old tickets on new station
            loadKDS(); 
            document.getElementById('kds-alarm').play().catch(()=>{});
            document.getElementById('kds-alarm').pause();
        }

        // ==========================================
        // 🎯 THE FIX: Bulletproof Smart Polling
        // ==========================================
        async function loadKDS() {
            try {
                const response = await fetch('/api/method/ultipos.api.kds.get_kds_data?_t=' + Date.now(), {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': window.csrf_token }
                });
                
                const data = await response.json();
                
                if (data.message) {
                    populatePrinters(data.message.printers);
                    renderBoard(data.message.orders, data.message.items);
                    isFirstLoad = false;
                }
            } catch (error) {
                console.error("Error fetching KDS data:", error);
            }
        }

        function populatePrinters(printers) {
            if (!isFirstLoad) return; // Only build dropdown once
            
            const selector = document.getElementById('station-selector');
            let options = `<option value="Main Station">Main Station (Fallback)</option>`;
            
            printers.forEach(p => {
                options += `<option value="${p.name}">${p.printer_name || p.name}</option>`;
            });
            
            selector.innerHTML = options;
        }

        function renderBoard(orders, items) {
            const board = document.getElementById('ticket-board');
            let html = "";
            let hasNewTicket = false;

            orders.forEach(order => {
                // ONLY show items that belong to THIS station!
                let myItems = items.filter(i => i.parent === order.name && i.assigned_printers.includes(currentStation));
                
                if (myItems.length === 0) return; // Hide ticket if this station has no items for it

                // Alarm Logic
                if (!isFirstLoad && !knownOrders.has(order.name)) {
                    hasNewTicket = true;
                }
                knownOrders.add(order.name);

                // Render Items
                let itemsHtml = '';
                myItems.forEach(it => {
                    let modsStr = '';
                    if (it.modifiers && it.modifiers !== "[]" && it.modifiers !== "null") {
                        try {
                            let parsed = typeof it.modifiers === 'string' ? JSON.parse(it.modifiers) : it.modifiers;
                            if (parsed.length > 0) {
                                modsStr = `<div class="mt-1.5 ml-9 flex flex-wrap gap-1">
                                              ${parsed.map(m => `<span class="text-xs font-semibold bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md border border-gray-200">+ ${m.name}</span>`).join('')}
                                           </div>`;
                            }
                        } catch(e) {}
                    }
                    
                    let noteStr = (it.notes && it.notes !== "null") ? `<div class="text-orange-700 text-xs font-bold bg-orange-50 px-2 py-1 rounded-md mt-2 ml-9 border border-orange-100">📝 ${it.notes}</div>` : '';
                    let statusBg = it.item_status === "Preparing" ? "bg-orange-100 text-orange-800 border-orange-200" : "bg-gray-100 text-gray-600 border-gray-200";

                    itemsHtml += `
                        <div class="py-4 border-b border-gray-100 last:border-0 group cursor-pointer hover:bg-gray-50 px-2 rounded-lg transition-colors" onclick="tapItem('${it.name}', '${it.item_status}')">
                            <div class="flex items-start justify-between">
                                <div class="flex items-start gap-3">
                                    <span class="bg-gray-900 text-white font-bold px-2.5 py-1 rounded-lg text-sm min-w-[36px] text-center shadow-sm">${it.qty}</span>
                                    <span class="font-bold text-lg text-gray-800 leading-tight pt-0.5 group-hover:text-orange-600 transition-colors">${it.item_name}</span>
                                </div>
                                <span class="text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wider border ${statusBg}">${it.item_status}</span>
                            </div>
                            ${modsStr}
                            ${noteStr}
                        </div>`;
                });

                const isDelivery = order.order_type === "Delivery";
                const headerBg = isDelivery ? 'bg-orange-50 border-orange-100 text-orange-800' : 'bg-blue-50 border-blue-100 text-blue-800';
                
                let orderNote = order.notes ? `<div class="bg-red-50 text-red-700 text-xs font-bold p-2 text-center border-b border-red-100 uppercase tracking-widest">⚠️ ${order.notes}</div>` : '';

                html += `
                    <div class="bg-white border border-gray-200 rounded-2xl w-[340px] max-h-full flex flex-col shadow-sm hover:shadow-xl transition-all duration-300 ticket-enter shrink-0 overflow-hidden">
                        <div class="${headerBg} border-b p-4 flex justify-between items-center shrink-0">
                            <div>
                                <div class="font-black text-2xl tracking-tight">${order.order_number.split('-').pop()}</div>
                                <div class="mt-1 inline-block bg-white/50 text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded-full">${order.order_type}</div>
                            </div>
                            <div class="text-right">
                                <div class="font-mono text-xl font-bold">${order.order_time}</div>
                            </div>
                        </div>
                        ${orderNote}
                        <div class="px-3 py-2 flex-1 overflow-y-auto min-h-[150px]">
                            ${itemsHtml}
                        </div>
                        <div class="p-3 bg-gray-50 border-t border-gray-100 shrink-0 text-center text-xs font-bold text-gray-400 uppercase tracking-widest">
                            Tap Items to mark Ready
                        </div>
                    </div>`;
            });

            if (html === "") {
                board.innerHTML = `
                    <div id="empty-state" class="w-full flex flex-col items-center justify-center text-gray-400 mt-32 absolute left-0">
                        <div class="bg-white p-6 rounded-full shadow-sm mb-4 border border-gray-100">
                            <svg class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        </div>
                        <h2 class="text-xl font-bold text-gray-600">No Active Tickets</h2>
                    </div>`;
            } else {
                board.innerHTML = html;
                if (hasNewTicket) {
                    document.getElementById('kds-alarm').currentTime = 0;
                    document.getElementById('kds-alarm').play().catch(e=>{});
                }
            }
        }

        async function tapItem(docname, currentStatus) {
            let nextStatus = currentStatus === "Received" ? "Preparing" : "Ready";
            try {
                await fetch('/api/method/ultipos.api.kds.update_item_status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': window.csrf_token },
                    body: JSON.stringify({ item_docname: docname, new_status: nextStatus })
                });
                loadKDS(); // Instant refresh!
            } catch (error) {
                console.error("Error updating item:", error);
            }
        }

        // Boot up!
        loadKDS();
        setInterval(loadKDS, 3000); // Silent sync every 3 seconds
    </script>
</body>
</html>
